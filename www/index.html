var R=Math.PI/180;
function pray(lat,lng,dt,tz){
 var d=Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate(),12)/864e5+2440587.5-2451545;
 var g=(357.529+.98560028*d)%360,q=(280.459+.98564736*d)%360;
 var L=q+1.915*Math.sin(g*R)+.02*Math.sin(2*g*R),e=23.439-4e-7*d;
 var ra=Math.atan2(Math.cos(e*R)*Math.sin(L*R),Math.cos(L*R))/R/15;ra=((ra%24)+24)%24;
 var dec=Math.asin(Math.sin(e*R)*Math.sin(L*R));
 var eq=q/15-ra;if(eq>12)eq-=24;if(eq<-12)eq+=24;
 var noon=12+tz-lng/15-eq;
 function T(a){var c=(Math.sin(a*R)-Math.sin(dec)*Math.sin(lat*R))/(Math.cos(dec)*Math.cos(lat*R));return Math.acos(Math.max(-1,Math.min(1,c)))/R/15}
 var asr=Math.atan(1/(1+Math.tan(Math.abs(lat*R-dec))))/R;
 return [["الفجر","🌅",noon-T(-19.5)],["الشروق","🌄",noon-T(-.833)],["الظهر","☀️",noon],["العصر","🌤️",noon+T(asr)],["المغرب","🌇",noon+T(-.833)],["العشاء","🌙",noon+T(-17.5)]];
}

 var n=new Date(),tz=-n.getTimezoneOffset()/60,t=pray(S.loc.lat,S.loc.lng,n,tz),cur=n.getHours()+n.getMinutes()/60+n.getSeconds()/3600,nx=-1;
 for(var i=0;i<6;i++){if(i!==1&&t[i][2]>cur){nx=i;break}}
 S.nx=nx<0?0:nx;S.t=t;S.nxTomorrow=nx<0;
 return '<h1>أوقات الصلاة</h1><div class="sm">'+esc(S.loc.name)+'</div><div class="big" id="cd"></div>'+
 t.map(function(x,i){return '<div class="pt '+(i===S.nx?"next":"")+'"><span>'+x[1]+' '+x[0]+'</span><i>'+fmt(x[2])+'</i></div>'}).join("")+
 qibla()+'<div style="text-align:center;margin-top:12px"><button class="act" id="geo">📍 استخدم موقعي</button></div><div class="sm">الحساب بطريقة الهيئة المصرية العامة للمساحة</div>';
}
function tick(){
 if(S.tab!=="pray"||!S.t)return;
 var n=new Date(),cur=n.getHours()*3600+n.getMinutes()*60+n.getSeconds(),tg=S.t[S.nx][2]*3600+(S.nxTomorrow?86400:0),s=Math.max(0,Math.floor(tg-cur)),el=$("cd");
 if(el)el.textContent=S.t[S.nx][0]+" بعد "+pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60);
}
function tasbeeh(){
 var T=S.tas;
 return '<h1>مسبحة</h1><div class="tas"><select id="tsel">'+TAS.map(function(x,i){return '<option value="'+i+'"'+(i===T.i?" selected":"")+'>'+x+'</option>'}).join("")+'</select>'+
 '<button class="ring" id="ring" aria-label="سبّح">'+T.n+'</button><div class="sm">الهدف: '+T.goal+' ('+[33,100].map(function(g){return '<a href="#" data-goal="'+g+'" style="color:var(--acc)">'+g+'</a>'}).join(" / ")+')</div>'+
 '<div class="chip">الإجمالي: '+T.tot+'</div><button class="act" id="rst">تصفير</button></div>';
}
/* reader */
function openR(k,i){
 var it=D[k].items;
 S.rd={k:k,i:i||0,left:it[i||0][1]};
 if(k==="duas"&&i!=null){S.rd.single=true}
 drawR();$("reader").hidden=false;
}
function drawR(){
 var r=S.rd,it=D[r.k].items,cur=it[r.i];
 $("reader").innerHTML='<div class="rbar"><button class="back" data-close="1">✕ إغلاق</button><b>'+esc(cur[2]||D[r.k].t)+'</b><span><button class="act" data-fs="-2">أ-</button> <button class="act" data-fs="2">أ+</button></span></div>'+
 '<div class="prog"><div style="width:'+((r.i+1)/it.length*100)+'%"></div></div><div class="rtext" style="--fs:'+S.fs+'px"><p>'+esc(cur[0])+'</p></div>'+
 '<div class="ctl"><button class="act" data-nav="1">التالي ›</button><button class="cnt" data-dec="1" aria-label="عدّاد التكرار">'+r.left+'</button><button class="act" data-nav="-1">‹ السابق</button></div>'+
 '<div class="ctl"><button class="act" data-share="1">📤 مشاركة / نسخ</button></div>';
}
function step(d){
 var r=S.rd,it=D[r.k].items,j=r.i+d;
 if(j<0||j>=it.length){if(d>0&&!r.single&&j>=it.length){S.my[r.k]=(S.my[r.k]||0)+1;sv();closeR();render()}return}
 r.i=j;r.left=it[j][1];drawR();
}
function closeR(){$("reader").hidden=true;S.rd=null}
document.addEventListener("click",function(e){
 var b=e.target.closest("[data-cal],[data-tab],[data-sub],[data-open],[data-go],[data-view],[data-close],[data-nav],[data-dec],[data-fs],[data-share],[data-goal],#ring,#rst,#geo,#cmp");if(!b)return;
 var d=b.dataset;
 if(d.goal){e.preventDefault();S.tas.goal=+d.goal;sv();render();return}
 if(b.id==="ring"){var T=S.tas;T.n++;T.tot++;if(T.n>=T.goal){T.n=0;if(navigator.vibrate)navigator.vibrate(60)}sv();b.textContent=T.n;document.querySelector(".chip").textContent="الإجمالي: "+T.tot;return}
 if(b.id==="cmp"){cmp();return}if(b.id==="rst"){S.tas.n=0;sv();render();return}
 if(b.id==="geo"){if(navigator.geolocation)navigator.geolocation.getCurrentPosition(function(p){S.loc={lat:p.coords.latitude,lng:p.coords.longitude,name:"موقعك الحالي"};sv();render()},function(){alert("تعذّر تحديد موقعك. فعّل إذن الموقع للمتصفح ثم أعد المحاولة.")});return}
 if(d.cal){calNav(d.cal);return}if(d.tab==="theme"){toggleTheme();return}if(d.tab){S.tab=d.tab;S.view=null;closeR();render();return}
 if(d.sub){S.sub=d.sub;render();return}
 if(d.view){S.view=d.view;S.q="";render();return}
 if(d.go!==undefined){S.view=null;render();return}
 if(d.open){d.i!=null?openR(d.open,+d.i):openR(d.open);return}
 if(d.close){closeR();return}
 if(d.nav){step(d.nav==="1"?1:-1);return}
 if(d.dec){if(navigator.vibrate)navigator.vibrate(15);var r=S.rd;if(r.left>1){r.left--;drawR()}else step(1);return}
 if(d.fs){S.fs=Math.max(20,Math.min(48,S.fs+ +d.fs));sv();drawR();return}
 if(d.share){var r2=S.rd,tx=D[r2.k].items[r2.i][0];if(navigator.share)navigator.share({text:tx}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(tx).then(function(){alert("تم النسخ")});return}
});
document.addEventListener("input",function(e){if(e.target.id==="q"){S.q=e.target.value;var p=e.target.selectionStart;render();var q=$("q");q.focus();q.setSelectionRange(p,p)}});
document.addEventListener("change",function(e){if(e.target.id==="tsel"){S.tas.i=+e.target.value;S.tas.n=0;sv();render()}});
setInterval(tick,1000);
function curTheme(){return document.documentElement.getAttribute("data-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}
function setTheme(t){document.documentElement.setAttribute("data-theme",t);try{localStorage.setItem("azkar_theme",t)}catch(e){}var m=document.querySelector('meta[name=theme-color]');if(m)m.content=t==="light"?"#e7f6ef":"#06141c"}
function toggleTheme(){setTheme(curTheme()==="light"?"dark":"light")}
try{var st=localStorage.getItem("azkar_theme");if(st)setTheme(st)}catch(e){}
function hij(){try{return new Date().toLocaleDateString("ar-EG-u-ca-islamic-umalqura",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}catch(e){return "السلام عليكم ورحمة الله"}}
function qibla(){var a=S.loc.lat*R,b=21.4225*R,dl=(39.8262-S.loc.lng)*R,y=Math.sin(dl)*Math.cos(b),x=Math.cos(a)*Math.sin(b)-Math.sin(a)*Math.cos(b)*Math.cos(dl);S.qb=(Math.atan2(y,x)/R+360)%360;return '<div class="qb"><div class="qd"><i id="qa" style="transform:rotate('+S.qb+'deg)">🕋</i></div><div class="sm">اتجاه القبلة: '+Math.round(S.qb)+'° من الشمال<br><button class="act" id="cmp" style="margin-top:8px">🧭 تشغيل البوصلة</button></div></div>'}
function cmp(){function go(){function h(e){var c=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.alpha!=null?360-e.alpha:null),el=$("qa");if(c!=null&&el)el.style.transform="rotate("+(S.qb-c)+"deg)"}window.addEventListener("deviceorientationabsolute",h,true);window.addEventListener("deviceorientation",h,true)}var O=window.DeviceOrientationEvent;if(O&&O.requestPermission)O.requestPermission().then(function(s){if(s==="granted")go()}).catch(function(){});else go()}
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0)navigator.serviceWorker.register("sw.js").catch(function(){});
function nextP(){var n=new Date(),tz=-n.getTimezoneOffset()/60,t=pray(S.loc.lat,S.loc.lng,n,tz),cur=n.getHours()*3600+n.getMinutes()*60+n.getSeconds(),nx=-1;for(var i=0;i<6;i++){if(i!==1&&t[i][2]*3600>cur){nx=i;break}}var tom=nx<0;if(tom)nx=0;return{t:t,nx:nx,T:t[nx][2]*3600+(tom?86400:0),s:Math.max(0,Math.floor(t[nx][2]*3600+(tom?86400:0)-cur))}}
function cdt(s){return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)}
function pstrip(){var p=nextP();S.hT=p.T;return '<div class="ps"><div class="pn"><span>'+p.t[p.nx][1]+' '+p.t[p.nx][0]+' بعد</span><b id="pcd">'+cdt(p.s)+'</b></div><div class="pr">'+p.t.map(function(x,i){return '<div class="'+(i===p.nx?"on":"")+'"><small>'+x[0]+'</small><b>'+fmt(x[2])+'</b></div>'}).join("")+'</div></div>'}
setInterval(function(){var e=$("pcd");if(!e||S.hT==null)return;var n=new Date(),s=Math.floor(S.hT-(n.getHours()*3600+n.getMinutes()*60+n.getSeconds()));if(s<=0)render();else e.textContent=cdt(s)},1000);
var HF=null,HL="ar-EG-u-ca-islamic-umalqura-nu-latn";
try{HF=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"numeric",year:"numeric"})}catch(e){}
var EV={"1-1":"رأس السنة الهجرية","10-1":"يوم عاشوراء","12-3":"المولد النبوي","27-7":"الإسراء والمعراج","15-8":"ليلة النصف من شعبان","1-9":"أول رمضان","1-10":"عيد الفطر","9-12":"يوم عرفة","10-12":"عيد الأضحى"};
function hp(dt){var o={};if(!HF)return {d:1,m:1,y:1};HF.formatToParts(dt).forEach(function(p){if(p.type==="day"||p.type==="month"||p.type==="year")o[p.type[0]]=+p.value});return o}
function hn(dt){var x=new Date(dt.getFullYear(),dt.getMonth(),dt.getDate(),12);return new Date(x.getTime()-(hp(x).d-1)*864e5)}
function calNav(a){if(a==="toggle"){S.co=!S.co}else{var f=S.cd||hn(new Date());if(a==="prev")S.cd=hn(new Date(f.getTime()-864e5));else if(a==="next")S.cd=hn(new Date(f.getTime()+30*864e5));else S.cd=null}render()}
function nextEv(td){for(var k=0;k<400;k++){var x=new Date(td.getFullYear(),td.getMonth(),td.getDate()+k,12),p=hp(x),n=EV[p.d+"-"+p.m];if(n)return{n:n,k:k}}return null}
function calendar(){
 if(!HF)return "";
 var td=new Date(),ah=new Intl.DateTimeFormat(HL,{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(td),gr=td.toLocaleDateString("ar-EG-u-nu-latn",{day:"numeric",month:"long",year:"numeric"}),up=nextEv(td);
 var s='<div class="cal"><button class="ch" data-cal="toggle"><span><b>📅 '+ah+'</b><small>'+gr+'</small></span><i>'+(S.co?"▲":"▼")+'</i></button>';
 if(up)s+='<div class="nev">🌙 '+up.n+' — '+(up.k?"بعد "+up.k+" يوم":"اليوم")+'</div>';
 if(S.co){
  var f=S.cd||hn(td),fp=hp(f),mn=new Intl.DateTimeFormat(HL,{month:"long",year:"numeric"}).format(f),off=(f.getDay()+1)%7,c="",el="";
  "سحنثرخج".split("").forEach(function(w){c+='<div class="h">'+w+'</div>'});
  for(var i=0;i<off;i++)c+='<span></span>';
  for(var j=0;j<30;j++){var x=new Date(f.getTime()+j*864e5),p=hp(x);if(p.m!==fp.m)break;var n=EV[p.d+"-"+p.m];c+='<div class="'+(x.toDateString()===td.toDateString()?"td":"")+(n?" ev":"")+'"><b>'+p.d+'</b><small>'+x.getDate()+'</small></div>';if(n)el+='<div class="el"><b>'+p.d+'</b> '+n+' ('+x.getDate()+'/'+(x.getMonth()+1)+')</div>'}
  s+='<div class="cn"><button class="act" data-cal="prev">›</button><span>'+mn+'</span><button class="act" data-cal="next">‹</button></div><div class="cg">'+c+'</div>'+el+'<div style="text-align:center;margin-top:8px"><button class="act" data-cal="today">اليوم</button></div><div class="sm">التقويم هو أم القرى، قد يختلف عن الرؤية المحلية بيوم.</div>'
 }
 return s+'</div>'}
ld();render();
</script>
